name: VoyageAI Release & APK Publisher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Release APK & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Code Formatting Check
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Automated Test Suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --pub --android-skip-build-dependency-validation

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: VoyageAI Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
