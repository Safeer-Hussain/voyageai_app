name: VoyageAI Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint, Static Analysis & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Resolve Project Dependencies
        run: flutter pub get

      - name: Code Formatting Check
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Cross-SDK Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Automated Test Suite with Coverage
        run: flutter test --coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore
