name: voyage_ai_app
description: "VoyageAI - Enterprise AI-Powered Travel Itinerary Planner and Expedition Suite."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  get_it: ^9.3.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  path: ^1.9.1
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.3.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
